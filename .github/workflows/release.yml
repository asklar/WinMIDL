name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    runs-on: windows-latest
    needs: build-and-test
    strategy:
      matrix:
        include:
          - rid: win-x64
            name: Windows x64
          - rid: win-arm64
            name: Windows ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish (${{ matrix.name }})
        run: dotnet publish src/Midl.Cli -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}

      - name: Zip artifacts
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath publish/winmidl-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmidl-${{ matrix.rid }}
          path: publish/winmidl-${{ matrix.rid }}.zip

  vscode-extension:
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc -p .
          npx @vscode/vsce package -o ../../publish/midl-language.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: publish/midl-language.vsix

  create-release:
    runs-on: ubuntu-latest
    needs: [publish, vscode-extension]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WinMIDL ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/winmidl-win-x64/winmidl-win-x64.zip
            artifacts/winmidl-win-arm64/winmidl-win-arm64.zip
            artifacts/vscode-extension/midl-language.vsix
