name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    runs-on: windows-latest
    needs: build-and-test
    strategy:
      matrix:
        include:
          - rid: win-x64
            name: Windows x64
            ilcInstructionSet: x86-64-v2
          - rid: win-arm64
            name: Windows ARM64
            ilcInstructionSet: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          # Strip prerelease for AssemblyVersion (must be X.Y.Z.W)
          $asmVer = ($ver -replace '-.*$', '')
          if ($asmVer -notmatch '^\d+\.\d+\.\d+$') { $asmVer = '0.0.0' }
          $asmVer = "$asmVer.0"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "ASM_VERSION=$asmVer" >> $env:GITHUB_OUTPUT
          echo "Version: $ver, AssemblyVersion: $asmVer"

      - name: Publish NativeAOT (${{ matrix.name }})
        run: >
          dotnet publish src/Midl.Cli -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:StripSymbols=true
          -p:IlcOptimizationPreference=Speed
          ${{ matrix.ilcInstructionSet && format('-p:IlcInstructionSet={0}', matrix.ilcInstructionSet) || '' }}
          -p:IlcFoldIdenticalMethodBodies=true
          -p:InvariantGlobalization=true
          -p:StackTraceSupport=false
          -p:UseSystemResourceKeys=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:AssemblyVersion=${{ steps.version.outputs.ASM_VERSION }}
          -p:FileVersion=${{ steps.version.outputs.ASM_VERSION }}
          -o publish/${{ matrix.rid }}

      - name: Fallback to self-contained if AOT fails
        if: failure()
        run: >
          dotnet publish src/Midl.Cli -c Release -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:AssemblyVersion=${{ steps.version.outputs.ASM_VERSION }}
          -p:FileVersion=${{ steps.version.outputs.ASM_VERSION }}
          -o publish/${{ matrix.rid }}

      - name: Zip artifacts
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath publish/winmidl-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmidl-${{ matrix.rid }}
          path: publish/winmidl-${{ matrix.rid }}.zip

  vscode-extension:
    runs-on: windows-latest
    needs: [build-and-test, publish]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Set extension version
        working-directory: editors/vscode
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = "${{ steps.version.outputs.VERSION }}" -replace '-.*$', ''
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Download win-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: winmidl-win-x64
          path: artifacts/win-x64

      - name: Download win-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: winmidl-win-arm64
          path: artifacts/win-arm64

      - name: Bundle server binaries into extension
        shell: pwsh
        run: |
          # Unzip and copy into extension server/ directory per RID
          Expand-Archive artifacts/win-x64/winmidl-win-x64.zip -DestinationPath editors/vscode/server/win-x64
          Expand-Archive artifacts/win-arm64/winmidl-win-arm64.zip -DestinationPath editors/vscode/server/win-arm64
          Get-ChildItem editors/vscode/server -Recurse -Filter "Midl.Cli.exe" | ForEach-Object { Write-Host "Bundled: $($_.FullName)" }

      - name: Build and package VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc -p .
          mkdir -p ../../publish
          npx @vscode/vsce package -o ../../publish/midl-language.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: publish/midl-language.vsix

  create-release:
    runs-on: ubuntu-latest
    needs: [publish, vscode-extension]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WinMIDL ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/winmidl-win-x64/winmidl-win-x64.zip
            artifacts/winmidl-win-arm64/winmidl-win-arm64.zip
            artifacts/vscode-extension/midl-language.vsix
