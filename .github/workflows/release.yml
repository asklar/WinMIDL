name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  publish:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - rid: win-x64
            name: Windows x64
            ilcInstructionSet: x86-64-v2
          - rid: win-arm64
            name: Windows ARM64
            ilcInstructionSet: ""
    steps:
      - uses: actions/checkout@v4

      - name: Discover MSVC and Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -prerelease -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { Write-Error "No Visual Studio with C++ found"; exit 1 }
          $vcVersion = (Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $vcTools = "$vsPath\VC\Tools\MSVC\$vcVersion"

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkVer = Get-ChildItem "$sdkRoot\Lib" -Directory |
            Where-Object { $_.Name -ne '10.0.26546.0' -and (Test-Path "$($_.FullName)\um\x64\advapi32.lib") } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) { Write-Error "No Windows SDK with libs found"; exit 1 }
          $sv = $sdkVer.Name

          # Set LIB and PATH so NativeAOT can skip vcvarsall (which picks the wrong SDK)
          $lib = "$vcTools\lib\x64;$sdkRoot\Lib\$sv\um\x64;$sdkRoot\Lib\$sv\ucrt\x64"
          echo "LIB=$lib" >> $env:GITHUB_ENV
          echo "PATH=$vcTools\bin\Hostx64\x64;$env:PATH" >> $env:GITHUB_ENV
          echo "IlcUseEnvironmentalTools=true" >> $env:GITHUB_ENV
          Write-Host "Using MSVC $vcVersion from $vsPath, SDK $sv"

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          # Strip prerelease for AssemblyVersion (must be X.Y.Z.W)
          $asmVer = ($ver -replace '-.*$', '')
          if ($asmVer -notmatch '^\d+\.\d+\.\d+$') { $asmVer = '0.0.0' }
          $asmVer = "$asmVer.0"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "ASM_VERSION=$asmVer" >> $env:GITHUB_OUTPUT
          echo "Version: $ver, AssemblyVersion: $asmVer"

      - name: Publish NativeAOT (${{ matrix.name }})
        id: aot
        continue-on-error: true
        run: >
          dotnet publish src/Midl.Cli -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:StripSymbols=true
          -p:IlcOptimizationPreference=Speed
          ${{ matrix.ilcInstructionSet && format('-p:IlcInstructionSet={0}', matrix.ilcInstructionSet) || '' }}
          -p:IlcFoldIdenticalMethodBodies=true
          -p:InvariantGlobalization=true
          -p:StackTraceSupport=false
          -p:UseSystemResourceKeys=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:AssemblyVersion=${{ steps.version.outputs.ASM_VERSION }}
          -p:FileVersion=${{ steps.version.outputs.ASM_VERSION }}
          -o publish/${{ matrix.rid }}

      - name: Fallback to self-contained if AOT fails
        if: steps.aot.outcome == 'failure'
        run: >
          dotnet publish src/Midl.Cli -c Release -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:AssemblyVersion=${{ steps.version.outputs.ASM_VERSION }}
          -p:FileVersion=${{ steps.version.outputs.ASM_VERSION }}
          -o publish/${{ matrix.rid }}

      - name: Zip artifacts
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath publish/winmidl-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmidl-${{ matrix.rid }}
          path: publish/winmidl-${{ matrix.rid }}.zip

  vscode-extension:
    runs-on: self-hosted
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Set extension version
        working-directory: editors/vscode
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = "${{ steps.version.outputs.VERSION }}" -replace '-.*$', ''
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Download win-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: winmidl-win-x64
          path: artifacts/win-x64

      - name: Download win-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: winmidl-win-arm64
          path: artifacts/win-arm64

      - name: Bundle server binaries into extension
        shell: pwsh
        run: |
          # Unzip and copy into extension server/ directory per RID
          Expand-Archive artifacts/win-x64/winmidl-win-x64.zip -DestinationPath editors/vscode/server/win-x64
          Expand-Archive artifacts/win-arm64/winmidl-win-arm64.zip -DestinationPath editors/vscode/server/win-arm64
          Get-ChildItem editors/vscode/server -Recurse -Filter "Midl.Cli.exe" | ForEach-Object { Write-Host "Bundled: $($_.FullName)" }

      - name: Build and package VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          mkdir -p ../../publish
          npx @vscode/vsce package -o ../../publish/midl-language.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: publish/midl-language.vsix

  create-release:
    runs-on: self-hosted
    needs: [publish, vscode-extension]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WinMIDL ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/winmidl-win-x64/winmidl-win-x64.zip
            artifacts/winmidl-win-arm64/winmidl-win-arm64.zip
            artifacts/vscode-extension/midl-language.vsix
