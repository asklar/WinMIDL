name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 4 * * 1'

permissions:
  contents: read
  security-events: write
  # Required in private repositories: the analyze step calls
  # GET /repos/{owner}/{repo}/actions/runs/{run_id} when attaching results.
  # Without this the run fails with "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning requires GitHub Advanced Security on private repositories.
    # This repo is currently private and personally owned, so GHAS is not
    # available ("Advanced security has not been purchased") and every run fails
    # at the upload step. Skip until the repo is public or lives in an org with
    # GHAS — at which point this re-enables itself with no further edits.
    if: github.event.repository.visibility == 'public' || github.repository_owner == 'microsoft'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4