name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Build VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc -p .

  native-aot:
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish NativeAOT
        run: dotnet publish src/Midl.Cli -c Release -r win-x64 --self-contained -o publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midl-win-x64
          path: publish/win-x64/

  release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest
    needs: [build-and-test, native-aot]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish win-x64
        run: dotnet publish src/Midl.Cli -c Release -r win-x64 --self-contained -o publish/win-x64

      - name: Publish win-arm64
        run: dotnet publish src/Midl.Cli -c Release -r win-arm64 --self-contained -o publish/win-arm64

      - name: Package VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc -p .
          npx @vscode/vsce package -o ../../publish/midl-language.vsix

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midl-release
          path: |
            publish/win-x64/
            publish/win-arm64/
            publish/midl-language.vsix
