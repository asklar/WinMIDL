name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # GitHub-hosted runner (public-repo safety). NOTE: MSVC/Windows SDK discovery may need adjustment on first hosted run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Build VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc -p .

      - name: Package VSIX (validate)
        working-directory: editors/vscode
        run: npx @vscode/vsce package --no-dependencies

  native-aot:
    # GitHub-hosted runner (public-repo safety). NOTE: MSVC/Windows SDK discovery may need adjustment on first hosted run.
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Discover MSVC and Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -prerelease -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { Write-Error "No Visual Studio with C++ found"; exit 1 }
          $vcVersion = (Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $vcTools = "$vsPath\VC\Tools\MSVC\$vcVersion"

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkVer = Get-ChildItem "$sdkRoot\Lib" -Directory |
            Where-Object { $_.Name -ne '10.0.26546.0' -and (Test-Path "$($_.FullName)\um\x64\advapi32.lib") } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) { Write-Error "No Windows SDK with libs found"; exit 1 }
          $sv = $sdkVer.Name

          # Set LIB and PATH so NativeAOT can skip vcvarsall (which picks the wrong SDK)
          $lib = "$vcTools\lib\x64;$sdkRoot\Lib\$sv\um\x64;$sdkRoot\Lib\$sv\ucrt\x64"
          echo "LIB=$lib" >> $env:GITHUB_ENV
          echo "PATH=$vcTools\bin\Hostx64\x64;$env:PATH" >> $env:GITHUB_ENV
          echo "IlcUseEnvironmentalTools=true" >> $env:GITHUB_ENV
          Write-Host "Using MSVC $vcVersion from $vsPath, SDK $sv"

      - name: Publish NativeAOT
        run: dotnet publish src/Midl.Cli -c Release -r win-x64 --self-contained -o publish/win-x64

      - name: Upload artifact
        if: false  # Artifacts are produced by the Release workflow; CI only validates the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: midl-win-x64
          path: publish/win-x64/
