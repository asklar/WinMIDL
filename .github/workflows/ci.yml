name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Build VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc -p .

  native-aot:
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Discover MSVC and Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -prerelease -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { Write-Error "No Visual Studio with C++ found"; exit 1 }
          $vcVersion = (Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          echo "VSINSTALLDIR=$vsPath\" >> $env:GITHUB_ENV
          echo "VCToolsInstallDir=$vsPath\VC\Tools\MSVC\$vcVersion\" >> $env:GITHUB_ENV

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkVer = Get-ChildItem "$sdkRoot\Lib" -Directory | Where-Object { Test-Path "$($_.FullName)\um\x64\advapi32.lib" } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) { Write-Error "No Windows SDK with libs found"; exit 1 }
          echo "WindowsSdkDir=$sdkRoot\" >> $env:GITHUB_ENV
          echo "WindowsSDKLibVersion=$($sdkVer.Name)\" >> $env:GITHUB_ENV
          echo "UCRTVersion=$($sdkVer.Name)" >> $env:GITHUB_ENV
          Write-Host "Using MSVC $vcVersion from $vsPath, SDK $($sdkVer.Name)"

      - name: Publish NativeAOT
        run: dotnet publish src/Midl.Cli -c Release -r win-x64 --self-contained -o publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midl-win-x64
          path: publish/win-x64/
