<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260">
  <defs>
    <style>
      text { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Window background -->
  <rect width="520" height="260" fill="#1e1e1e"/>

  <!-- Tab bar -->
  <rect x="0" y="0" width="520" height="28" fill="#252526"/>
  <rect x="56" y="0" width="120" height="28" fill="#1e1e1e"/>
  <text x="72" y="18" fill="#d4d4d4" font-size="12">test.idl</text>

  <!-- Breadcrumb -->
  <rect x="0" y="28" width="520" height="18" fill="#1e1e1e"/>
  <text x="14" y="41" fill="#a0a0a0" font-size="10">C: &gt; Users &gt; asklar &gt;</text>

  <!-- Line numbers + code -->
  <text x="26" y="68" fill="#858585" font-size="13" text-anchor="end">1</text>
  <text x="26" y="88" fill="#858585" font-size="13" text-anchor="end">2</text>
  <text x="26" y="148" fill="#858585" font-size="13" text-anchor="end">3</text>
  <text x="26" y="168" fill="#858585" font-size="13" text-anchor="end">4</text>
  <text x="26" y="188" fill="#858585" font-size="13" text-anchor="end">5</text>
  <text x="26" y="208" fill="#858585" font-size="13" text-anchor="end">6</text>

  <!-- Line 1: namespace (partially hidden behind popup) -->
  <text x="38" y="68" fill="#569cd6" font-size="13">namespa</text>

  <!-- Line 2: runtimeclass (partially hidden) -->
  <text x="38" y="88" fill="#569cd6" font-size="13">runt</text>

  <!-- Line 3: Strng Title; -->
  <text x="58" y="148" fill="#4ec9b0" font-size="13">Strng</text>
  <text x="104" y="148" fill="#9cdcfe" font-size="13">Title</text>
  <text x="148" y="148" fill="#d4d4d4" font-size="13">;</text>
  <!-- red squiggly under Strng -->
  <path d="M58,153 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2" stroke="#f44747" stroke-width="1.2" fill="none"/>

  <!-- Line 4: Int32 Width { get; set; }; -->
  <text x="58" y="168" fill="#569cd6" font-size="13">Int32</text>
  <text x="102" y="168" fill="#9cdcfe" font-size="13">Width</text>
  <text x="148" y="168" fill="#d4d4d4" font-size="13">{</text>
  <text x="160" y="168" fill="#569cd6" font-size="13">get</text>
  <text x="186" y="168" fill="#d4d4d4" font-size="13">;</text>
  <text x="196" y="168" fill="#569cd6" font-size="13">set</text>
  <text x="222" y="168" fill="#d4d4d4" font-size="13">;</text>
  <text x="232" y="168" fill="#d4d4d4" font-size="13">};</text>
  <!-- blue squiggly under Width -->
  <path d="M102,173 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2" stroke="#3794ff" stroke-width="1.2" fill="none"/>

  <!-- Line 5: } -->
  <text x="38" y="188" fill="#d4d4d4" font-size="13">}</text>

  <!-- Line 6: } -->
  <text x="38" y="208" fill="#d4d4d4" font-size="13">}</text>

  <!-- ========== HOVER POPUP ========== -->
  <!-- Popup shadow -->
  <rect x="68" y="52" width="380" height="80" rx="2" fill="#000000" opacity="0.3" transform="translate(2,2)"/>
  <!-- Popup background -->
  <rect x="68" y="52" width="380" height="80" rx="2" fill="#252526" stroke="#454545" stroke-width="1"/>

  <!-- Error message line -->
  <text x="80" y="72" fill="#d4d4d4" font-size="12">Undefined type &apos;<tspan fill="#dcdcaa">Strng</tspan>&apos; <tspan fill="#858585">midl(MIDL1001)</tspan></text>

  <!-- Divider -->
  <line x1="80" y1="82" x2="436" y2="82" stroke="#454545" stroke-width="0.5"/>

  <!-- Identifier info -->
  <text x="80" y="100" fill="#569cd6" font-size="12">identifier</text>
  <text x="160" y="100" fill="#d4d4d4" font-size="12">Strng</text>

  <!-- Divider -->
  <line x1="80" y1="110" x2="436" y2="110" stroke="#454545" stroke-width="0.5"/>

  <!-- Action links -->
  <text x="80" y="126" fill="#3794ff" font-size="11">View Problem (Alt+F8)</text>
  <text x="240" y="126" fill="#3794ff" font-size="11">Quick Fix... (Ctrl+.)</text>
  <text x="400" y="126" fill="#3794ff" font-size="11">🔧 Fix</text>
</svg>
