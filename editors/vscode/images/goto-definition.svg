  <text x="132" y="82" fill="#d4d4d4" font-size="13">,</text>
  <text x="146" y="82" fill="#b5cea8" font-size="13">Playing</text>
  <text x="204" y="82" fill="#d4d4d4" font-size="13">,</text>
