  <text x="178" y="270" fill="#d4d4d4" font-size="12">{</text>
  <text x="92" y="288" fill="#b5cea8" font-size="12">Stopped</text>
  <text x="146" y="288" fill="#d4d4d4" font-size="12">,</text>
  <text x="158" y="288" fill="#b5cea8" font-size="12">Playing</text>
  <text x="208" y="288" fill="#d4d4d4" font-size="12">,</text>
  <text x="220" y="288" fill="#b5cea8" font-size="12">Paused</text>
