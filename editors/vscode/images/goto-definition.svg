  <text x="52" y="142" fill="#569cd6" font-size="13">interface</text>
  <text x="130" y="142" fill="#4ec9b0" font-size="13">IPlaybackControl</text>
  <text x="268" y="142" fill="#d4d4d4" font-size="13">{</text>

