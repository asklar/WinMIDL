  <rect x="52" y="244" width="600" height="8" fill="#007acc"/>
  <text x="64" y="246" fill="#ffffff" font-size="11" font-weight="bold">Player.idl — enum PlayState</text>
  <text x="640" y="246" fill="#ffffff" font-size="11" text-anchor="end">✕</text>

  <!-- Peek content - line numbers -->
  <text x="66" y="270" fill="#858585" font-size="11">1</text>
  <text x="66" y="288" fill="#858585" font-size="11">2</text>

  <!-- Peek content - code -->
  <text x="82" y="270" fill="#569cd6" font-size="12">enum</text>
  <text x="112" y="270" fill="#4ec9b0" font-size="12">PlayState</text>

