<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Braces -->
  <text x="8" y="86" font-family="Consolas, monospace" font-size="76" font-weight="200" fill="#0078D4" opacity="0.07">{</text>
  <text x="74" y="86" font-family="Consolas, monospace" font-size="76" font-weight="200" fill="#0078D4" opacity="0.07">}</text>
  <!-- M -->
  <text x="12" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">M</text>
  <!-- UML lollipop I -->
  <circle cx="50" cy="44" r="5" fill="none" stroke="#0078D4" stroke-width="2.5"/>
  <line x1="50" y1="49" x2="50" y2="70" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- DL -->
  <text x="59" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">DL</text>
  <!-- Accent line -->
  <rect x="12" y="78" width="104" height="3" rx="1.5" fill="#0078D4"/>
</svg>
